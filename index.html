<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Links para canais e redes sociais de André Silva Lessa">
    <title>André Silva Lessa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwindcss.config = {
        theme: {
          extend: {
            fontFamily: {
              manrope: ['Manrope', 'sans-serif'],
            },
          }
        }
      }
    </script>

    <style>
      body {
        background: url('./svg/bg.svg');
        background-size: cover;
        background-position: center;
      }

      .glass-btn {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid rgba(255, 255, 255, 0.3);

      }

      .glass-btn:hover {
        transform: translateY(-2px) scale(1.03);
      }

      @keyframes slideIn {
        0% {
          opacity: 0;
          transform: translateX(-50px);
        }

        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInUp {
        0% {
          opacity: 0;
          transform: translateY(-50px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-slideInLeft {
        animation: slideIn 1s ease-out forwards;
      }

      .animate-slideInUp {
        animation: slideInUp 1s ease-out forwards;
      }
    </style>
  </head>

  <body class="min-h-screen flex items-center justify-center font-manrope">

    <main class="p-4 md:p-8 w-full max-w-md md:max-w-lg mx-4">
      <div class="flex flex-col items-center">
        <div class="w-40 h-40 rounded-full relative overflow-hidden animate-slideInUp">
          <img src="./img/img-perfil-1.png" alt="Foto de André Silva Lessa" loading="lazy"
            class="absolute w-full h-full object-cover z-20">
          <div class="absolute w-full h-full bg-[#8da17f] rounded-full border-[15px] border-[#e8dfd0]"></div>
        </div>
        <h1 class="text-4xl font-bold mt-5 text-[#3d4a2e] animate-slideInLeft transition-all">André Silva
          Lessa</h1>
        <p class="text-[#6b7a5e] text-lg font-manrope mt-1 animate-slideInLeft transition-all">Perto do
          Pai é
          bem melhor!</p>
      </div>

      <section class="mt-8 space-y-4">
        <a href="https://youtube.com/@pertodopai3944?si=H7_eUA-upSTYgG3c" target="_blank" rel="noopener noreferrer"
          class="glass-btn flex items-center justify-center w-full py-3.5 text-[#4a5a3a] rounded-2xl active:scale-95 font-medium animate-slideInLeft"
          aria-label="Acessar o canal 'Perto do pai' no YouTube">
          <i class="fab fa-youtube mr-2 text-lg" aria-hidden="true"></i> YouTube
        </a>
        <a href="https://www.instagram.com/andre.silvalessa?utm_source=qr&igsh=MTVmdm10MmN4ZGF5NQ==" target="_blank"
          rel="noopener noreferrer"
          class="glass-btn flex items-center justify-center w-full py-3.5 text-[#4a5a3a] rounded-2xl active:scale-95 font-medium animate-slideInLeft"
          aria-label="Visitar o perfil de André Silva Lessa no Instagram">
          <i class="fab fa-instagram mr-2 text-lg" aria-hidden="true"></i> Instagram
        </a>
        <a href="https://www.tiktok.com/@1986andre?_t=ZM-8uiVEh8YtgV&_r=1" target="_blank" rel="noopener noreferrer"
          class="glass-btn flex items-center justify-center w-full py-3.5 text-[#4a5a3a] rounded-2xl active:scale-95 font-medium animate-slideInLeft"
          aria-label="Acessar o perfil de André Silva Lessa no TikTok">
          <i class="fab fa-tiktok mr-2 text-lg" aria-hidden="true"></i> TikTok
        </a>
        <a href="https://www.facebook.com/share/15h2ioFeb4/" target="_blank" rel="noopener noreferrer"
          class="glass-btn flex items-center justify-center w-full py-3.5 text-[#4a5a3a] rounded-2xl active:scale-95 font-medium animate-slideInLeft"
          aria-label="Visitar o perfil de André Silva Lessa no Facebook">
          <i class="fab fa-facebook mr-2 text-lg" aria-hidden="true"></i> Facebook
        </a>
      </section>



    </main>

  </body>

</html>
